[project]
name = "ha-cyberpower-pdu"
version = "0.1.0"
description = "Home Assistant integration for CyberPower switched PDUs (SNMP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
