version: 2
updates:
  # Keep pinned GitHub Actions (by SHA) up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Track Python test/tooling dependencies (requirements_test.txt, pyproject.toml).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
